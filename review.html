<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submitted</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header>
        <h1>Thank you for your review!
            It means a lot to the company.</h1>
    </header>

    <main>
        <p>Your review has been successfully submitted.</p>
        <p>You have submitted <span id="reviewCount"></span> review(s) so far.</p>
        <a href="form.html">Submit another review</a>
    </main>

    <footer>
        <p>©<span id="currentyear"></span> Clementine , Netherlands</p>
    <p id="lastModified"></p>
    </footer>

    <script>

        
  // Set current year
  document.getElementById('currentyear').textContent = new Date().getFullYear();

  // Set last modified date of the page
  document.getElementById('lastModified').textContent = 
    "Last modified: " + document.lastModified;

        let count = localStorage.getItem('reviewCount') || 0;
        count++;
        localStorage.setItem('reviewCount', count);
        document.getElementById('reviewCount').textContent = count;
    </script>
</body>
</html>
