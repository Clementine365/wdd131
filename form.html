<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit your review for our products using this form. Provide ratings, comments, and feedback easily.">
     <meta name="author" content="Clementine Iradukunda">
    <title>Product Review Form</title>
    <!-- Good way to include Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/product.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get" id="reviewForm">
            <!-- Product Name -->
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>
                <label><input type="radio" name="rating" value="1" required> ☆</label>
                <label><input type="radio" name="rating" value="2"> ☆☆</label>
                <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
                <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
                <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
            </fieldset>

            <!-- Date of Installation -->
            <label for="date">Date of Installation</label>
            <input type="date" id="date" name="date" required>

            <!-- Useful Features -->
            <fieldset>
                <legend>Which features did you find useful in the product? (Check all that apply)</legend>
                <label><input type="checkbox" name="features" value="Durability"> Durability</label>
                <label><input type="checkbox" name="features" value="Ease of Use"> Ease of Use</label>
                <label><input type="checkbox" name="features" value="Performance"> Performance</label>
                <label><input type="checkbox" name="features" value="Design"> Design</label>
            </fieldset>

            <!-- Written Review -->
            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review"></textarea>

            <!-- User Name -->
            <label for="name">Your Name (Optional)</label>
            <input type="text" id="name" name="name">

            <!-- Submit Button -->
            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>©<span id="currentyear"></span> Clementine , Netherlands</p>
    <p id="lastModified"></p>
    </footer>
    <script>
  // Set current year
  document.getElementById('currentyear').textContent = new Date().getFullYear();

  // Set last modified date of the page
  document.getElementById('lastModified').textContent = 
    "Last modified: " + document.lastModified;
</script>
</body>
</html>
